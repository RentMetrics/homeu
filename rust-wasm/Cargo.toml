[workspace]
resolver = "2"
members = [
    "homeu-core",
    "homeu-resident-scores",
    "homeu-pm-scores",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HomeU <dev@homeu.co>"]
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "0.2.99"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[profile.release]
opt-level = "s"
lto = true
